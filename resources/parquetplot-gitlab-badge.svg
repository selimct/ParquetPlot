<svg xmlns="http://www.w3.org/2000/svg" width="101" height="20" viewBox="0 0 101 20" role="img" aria-label="ParquetPlot">
  <title>ParquetPlot</title>
  <defs>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183153"/>
      <stop offset="1" stop-color="#246b8e"/>
    </linearGradient>
    <linearGradient id="labelbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666"/>
      <stop offset="1" stop-color="#555"/>
    </linearGradient>
    <clipPath id="badgeclip">
      <rect width="101" height="20" rx="3"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badgeclip)">
    <rect width="20" height="20" fill="url(#iconbg)"/>
    <rect x="20" width="81" height="20" fill="url(#labelbg)"/>

    <!-- ParquetPlot icon, scaled from its original 256x256 SVG -->
    <g transform="translate(1 1) scale(0.0703125)">
      <path d="M32 132h40l18-52 28 112 30-128 23 68h53"
            fill="none" stroke="#f5d547" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 212h192" fill="none" stroke="#fff" stroke-opacity=".45"
            stroke-width="8" stroke-linecap="round"/>
    </g>

    <text x="60.5" y="14"
          text-anchor="middle"
          font-family="Verdana,DejaVu Sans,sans-serif"
          font-size="11"
          fill="#fff">ParquetPlot</text>
  </g>
</svg>
